[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctoolkitpy_v0_1"
version = "0.1.0"
description = "Code Toolkit to Python"
authors = [
  { name="tsaiyuchi88", email="tsaiyuchi88@gmail.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    # 如果你的 logger 依賴其他套件，列在這裡
    # e.g. "colorama>=0.4.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ctoolkitpy_v0_1"]
